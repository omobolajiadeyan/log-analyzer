<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Log Analyzer evidence run</title>
  <desc id="desc">A polished evidence graphic showing a real Log Analyzer sample run summary: two files, twenty-one lines, nineteen alerts, three critical alerts, and nine high alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="120" y="102" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Log Analyzer evidence run</text>
  <text x="120" y="146" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Synthetic public-safe logs with MITRE ATT&amp;CK mapped findings.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="188" width="1200" height="560" rx="26" fill="#0f172a"/>
    <rect x="156" y="224" width="1128" height="488" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="194" cy="254" r="9" fill="#ff6b6b"/>
    <circle cx="226" cy="254" r="9" fill="#f8c555"/>
    <circle cx="258" cy="254" r="9" fill="#36c76b"/>
    <text x="720" y="262" fill="#94a3b8" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" text-anchor="middle">python analyzer.py sample_logs/ --verbose</text>

    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="24">
      <text x="196" y="330" fill="#38bdf8">LOG ANALYZER REPORT</text>
      <text x="196" y="384" fill="#e5e7eb">Files analyzed : 2</text>
      <text x="196" y="424" fill="#e5e7eb">Total lines    : 21</text>
      <text x="196" y="464" fill="#e5e7eb">Total alerts   : 19</text>
      <text x="196" y="504" fill="#fb7185">Critical       : 3</text>
      <text x="196" y="544" fill="#fdba74">High           : 9</text>

      <text x="682" y="384" fill="#c084fc">Top evidence</text>
      <text x="682" y="426" fill="#e5e7eb">Web Attack          5 alerts</text>
      <text x="682" y="466" fill="#e5e7eb">Authentication     10 alerts</text>
      <text x="682" y="506" fill="#e5e7eb">Top IP 192.168.1.105</text>
      <text x="682" y="546" fill="#e5e7eb">SARIF + JSON export</text>
    </g>

    <rect x="196" y="612" width="1024" height="58" rx="12" fill="#172033" stroke="#3b82f6"/>
    <text x="708" y="649" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Browser report viewer included for reviewer-friendly JSON evidence</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">
    <rect x="120" y="790" width="232" height="44" rx="22" fill="#fee2e2" stroke="#ef4444"/>
    <text x="236" y="818" fill="#991b1b" text-anchor="middle">Critical alerts fail CI</text>
    <rect x="374" y="790" width="202" height="44" rx="22" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="475" y="818" fill="#1d4ed8" text-anchor="middle">SARIF 2.1.0</text>
    <rect x="598" y="790" width="230" height="44" rx="22" fill="#dcfce7" stroke="#22c55e"/>
    <text x="713" y="818" fill="#166534" text-anchor="middle">No dependencies</text>
    <rect x="850" y="790" width="300" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="1000" y="818" fill="#334155" text-anchor="middle">Generated July 29, 2026</text>
  </g>
</svg>
